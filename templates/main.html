<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация на сайт</title>
    <style>

        body {
            background-color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('mts.jpg');
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(211, 47, 46, 0.15);
            text-align: center;
            max-width: 300px;
            width: 100%;
            border: 1px solid #d32f2f;
        }

        h2 {
            color: #d32f2f;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 15px;
        }

        .btn-oval {
            display: inline-block;
            background-color: #d32f2f; 
            color: white; 
            padding: 8px 16px; 
            border-radius: 50px; 
            text-decoration: none;
            font-size: 14px; 
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .btn-oval:hover {
            background-color: #9a0007; 
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Вход</h2>
        <ul>
            <li><a href="reg" class="btn-oval">Регистрация</a></li>
            <li><a href="auth" class="btn-oval">Авторизация</a></li>
        </ul>
    </div>
</body>
</html>
