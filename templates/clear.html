<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Очистка</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image:url('mtc.png');
        }

        .btn-oval {
            display: inline-block;
            background-color: #d32f2f; 
            color: white; 
            padding: 8px 16px; 
            border-radius: 50px; 
            text-decoration: none;
            font-size: 14px; 
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .btn-oval:hover {
            background-color: #9a0007; 
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .registration-form {
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            width: 340px;
        }

        .registration-form h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #2c3e50;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button.register-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ff4d4d 0%, #ff0000 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.3s, background 0.3s;
            box-shadow: 0 4px 12px rgba(255, 77, 77, 0.35);
        }

        button.register-btn:hover {
            background: linear-gradient(135deg, #e63535 0%, #cc0000 100%);
            box-shadow: 0 6px 16px rgba(255, 77, 77, 0.45);
        }

        button.register-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="registration-form">
    <h2>Очистка</h2>
    <form action="hub.html" method="POST">

        <div class="form-group">
            <label for="last-name">Пароль</label>
            <input type="text" id="password" name="password" required placeholder="Введите пароль">
        </div>

       <lu><a href="hub.html" class="btn-oval">Очистить</a></lu>
    </form>
</div>
</body>
</html>
